  fields:
    instance_id:
      name: ID instance
      description: Identifiant de l'instance de tâche
      required: true
      example: "instance_xyz789"
      selector:
        text:

cancel_task_instance:
  name: Annuler une instance
  description: Annule une instance de tâche planifiée
  fields:
    instance_id:
      name: ID instance
      description: Identifiant de l'instance à annuler
      required: true
      example: "instance_xyz789"
      selector:
        text:
    reason:
      name: Raison
      description: Raison de l'annulation (optionnel)
      required: false
      example: "Tâche non applicable cette semaine"
      selector:
        text:

reschedule_task_instance:
  name: Replanifier une instance
  description: Replanifie une instance de tâche à une nouvelle date
  fields:
    instance_id:
      name: ID instance
      description: Identifiant de l'instance à replanifier
