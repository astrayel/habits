        text:

get_child_stats:
  name: Statistiques d'un enfant
  description: Récupère les statistiques globales d'un enfant (tâches, habitudes, récompenses, points)
  fields:
    child_id:
      name: ID enfant
      description: Identifiant de l'enfant
