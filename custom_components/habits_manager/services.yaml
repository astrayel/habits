# Services pour Habits Manager
# Phase 1: Services de base (CRUD pour enfants, tâches, habitudes)

# ========================================================================
# SERVICES ENFANTS
# ========================================================================

create_child:
  name: Créer un enfant
  description: Crée un nouveau profil d'enfant dans le système
  fields:
    name:
      name: Nom
      description: Nom de l'enfant
      required: true
      example: "Sophie"
      selector:
        text:
    person_entity:
      name: Entité personne
      description: Entité person.* de Home Assistant associée à l'enfant
      required: true
      example: "person.sophie"
      selector:
        entity:
          domain: person

update_child:
  name: Mettre à jour un enfant
  description: Modifie les informations d'un enfant existant
  fields:
    child_id:
      name: ID enfant
      description: Identifiant unique de l'enfant
      required: true
      example: "child_123abc"
      selector:
        text:
    name:
      name: Nom
      description: Nouveau nom de l'enfant
      required: false
      example: "Sophie Martin"
      selector:
        text:

delete_child:
  name: Supprimer un enfant
  description: Supprime définitivement un profil d'enfant et toutes ses données
  fields:
    child_id:
      name: ID enfant
      description: Identifiant unique de l'enfant à supprimer
      required: true
      example: "child_123abc"
      selector:
        text:

add_points:
  name: Ajouter des points
  description: Ajoute des points manuellement à un enfant
  fields:
    child_id:
      name: ID enfant
      description: Identifiant de l'enfant
      required: true
      example: "child_123abc"
      selector:
        text:
    points:
      name: Points
      description: Nombre de points à ajouter
      required: true
      example: 50
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    reason:
      name: Raison
      description: Raison de l'ajout (optionnel)
      required: false
      example: "Bonus pour bon comportement"
      selector:
        text:

remove_points:
  name: Retirer des points
  description: Retire des points manuellement à un enfant
  fields:
    child_id:
      name: ID enfant
      description: Identifiant de l'enfant
      required: true
      example: "child_123abc"
      selector:
        text:
    points:
      name: Points
      description: Nombre de points à retirer
      required: true
      example: 20
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    reason:
      name: Raison
      description: Raison du retrait (optionnel)
      required: false
      example: "Pénalité pour comportement inapproprié"
      selector:
        text:

set_points:
  name: Définir les points
  description: Définit le nombre total de points d'un enfant
  fields:
    child_id:
      name: ID enfant
      description: Identifiant de l'enfant
      required: true
      example: "child_123abc"
      selector:
        text:
    points:
      name: Points
      description: Nombre de points à définir
      required: true
      example: 100
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    reason:
      name: Raison
      description: Raison du changement (optionnel)
      required: false
      example: "Réinitialisation mensuelle"
      selector:
        text:

add_coins:
  name: Ajouter des pièces
  description: Ajoute des pièces manuellement à un enfant
  fields:
    child_id:
      name: ID enfant
      description: Identifiant de l'enfant
      required: true
      example: "child_123abc"
      selector:
        text:
    coins:
      name: Pièces
      description: Nombre de pièces à ajouter
      required: true
      example: 10
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    reason:
      name: Raison
      description: Raison de l'ajout (optionnel)
      required: false
      example: "Bonus exceptionnel"
      selector:
        text:

remove_coins:
  name: Retirer des pièces
  description: Retire des pièces manuellement à un enfant
  fields:
    child_id:
      name: ID enfant
      description: Identifiant de l'enfant
      required: true
      example: "child_123abc"
      selector:
        text:
    coins:
      name: Pièces
      description: Nombre de pièces à retirer
      required: true
      example: 5
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    reason:
      name: Raison
      description: Raison du retrait (optionnel)
      required: false
      example: "Correction d'erreur"
      selector:
        text:

set_coins:
  name: Définir les pièces
  description: Définit le nombre total de pièces d'un enfant
  fields:
    child_id:
      name: ID enfant
      description: Identifiant de l'enfant
      required: true
      example: "child_123abc"
      selector:
        text:
    coins:
      name: Pièces
      description: Nombre de pièces à définir
      required: true
      example: 50
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    reason:
      name: Raison
      description: Raison du changement (optionnel)
      required: false
      example: "Réinitialisation"
      selector:
        text:

get_child_history:
  name: Historique d'un enfant
  description: Récupère l'historique des points d'un enfant
  fields:
    child_id:
      name: ID enfant
      description: Identifiant de l'enfant
      required: true
      example: "child_123abc"
      selector:
        text:
    limit:
      name: Limite
      description: Nombre maximum d'entrées à retourner (max 50)
      required: false
      default: 20
      example: 30
      selector:
        number:
          min: 1
          max: 50
          mode: box
    action_type_filter:
      name: Filtre type d'action
      description: Filtrer par type d'action (optionnel)
      required: false
      example: "task_validated"
      selector:
        select:
          options:
            - label: "Tâche validée"
              value: "task_validated"
            - label: "Habitude complétée"
              value: "habit_completed"
            - label: "Récompense réclamée"
              value: "reward_claimed"
            - label: "Pénalité appliquée"
              value: "penalty_applied"
            - label: "Ajustement manuel"
              value: "manual_adjustment"

# ========================================================================
# SERVICES TÂCHES
# ========================================================================

create_task:
  name: Créer une tâche
  description: Crée une nouvelle tâche assignée à un ou plusieurs enfants
  fields:
    title:
      name: Titre
      description: Titre de la tâche
      required: true
      example: "Ranger sa chambre"
      selector:
        text:
    description:
      name: Description
      description: Description détaillée de la tâche
      required: false
      example: "Ranger les jouets, faire son lit, passer l'aspirateur"
      selector:
        text:
          multiline: true
    assigned_to:
      name: Assignée à
      description: Liste des IDs d'enfants auxquels assigner la tâche
      required: true
      example: "child_123abc"
      selector:
        text:
    difficulty:
      name: Difficulté
      description: Niveau de difficulté (1=facile, 2=moyen, 3=difficile)
      required: true
      default: 1
      example: 2
      selector:
        number:
          min: 1
          max: 3
          mode: box
    task_type:
      name: Type
      description: Type de tâche (mandatory=obligatoire, bonus=optionnelle)
      required: true
      default: "mandatory"
      example: "mandatory"
      selector:
        select:
          options:
            - label: "Obligatoire"
              value: "mandatory"
            - label: "Bonus"
              value: "bonus"

update_task:
  name: Mettre à jour une tâche
  description: Modifie les informations d'une tâche existante
  fields:
    task_id:
      name: ID tâche
      description: Identifiant unique de la tâche
      required: true
      example: "task_456def"
      selector:
        text:
    title:
      name: Titre
      description: Nouveau titre de la tâche
      required: false
      example: "Ranger sa chambre et son bureau"
      selector:
        text:
    description:
      name: Description
      description: Nouvelle description
      required: false
      selector:
        text:
          multiline: true
    is_active:
      name: Active
      description: Activer ou désactiver la tâche
      required: false
      example: true
      selector:
        boolean:

delete_task:
  name: Supprimer une tâche
  description: Supprime définitivement une tâche
  fields:
    task_id:
      name: ID tâche
      description: Identifiant unique de la tâche à supprimer
      required: true
      example: "task_456def"
      selector:
        text:

mark_task_completed:
  name: Marquer tâche complétée
  description: Marque une instance de tâche comme complétée (en attente de validation parent)
  fields:
    instance_id:
      name: ID instance
      description: Identifiant unique de l'instance de tâche
      required: true
      example: "instance_789ghi"
      selector:
        text:
    child_id:
      name: ID enfant
      description: Identifiant de l'enfant qui a complété la tâche
      required: true
      example: "child_123abc"
      selector:
        text:
    photo_url:
      name: Preuve photo
      description: URL de la photo servant de preuve (optionnel)
      required: false
      example: "/local/proofs/chambre_rangee.jpg"
      selector:
        text:

# ========================================================================
# SERVICES HABITUDES
# ========================================================================

create_habit:
  name: Créer une habitude
  description: Crée une nouvelle habitude avec système de streaks
  fields:
    title:
      name: Titre
      description: Titre de l'habitude
      required: true
      example: "Pratiquer Duolingo"
      selector:
        text:
    description:
      name: Description
      description: Description détaillée de l'habitude
      required: false
      example: "Faire au moins une leçon de 5 minutes"
      selector:
        text:
          multiline: true
    assigned_to:
      name: Assignée à
      description: Liste des IDs d'enfants auxquels assigner l'habitude
      required: true
      example: "child_123abc"
      selector:
        text:
    frequency:
      name: Fréquence
      description: Fréquence de l'habitude (daily, weekly, monthly)
      required: true
      default: "daily"
      example: "daily"
      selector:
        select:
          options:
            - label: "Quotidienne"
              value: "daily"
            - label: "Hebdomadaire"
              value: "weekly"
            - label: "Mensuelle"
              value: "monthly"

update_habit:
  name: Mettre à jour une habitude
  description: Modifie les informations d'une habitude existante
  fields:
    habit_id:
      name: ID habitude
      description: Identifiant unique de l'habitude
      required: true
      example: "habit_321jkl"
      selector:
        text:
    title:
      name: Titre
      description: Nouveau titre de l'habitude
      required: false
      example: "Pratiquer Duolingo 10 minutes"
      selector:
        text:
    description:
      name: Description
      description: Nouvelle description
      required: false
      selector:
        text:
          multiline: true
    is_active:
      name: Active
      description: Activer ou désactiver l'habitude
      required: false
      example: true
      selector:
        boolean:

delete_habit:
  name: Supprimer une habitude
  description: Supprime définitivement une habitude
  fields:
    habit_id:
      name: ID habitude
      description: Identifiant unique de l'habitude à supprimer
      required: true
      example: "habit_321jkl"
      selector:
        text:

mark_habit_completed:
  name: Marquer une habitude comme complétée
  description: Enregistre la complétion d'une habitude pour aujourd'hui et calcule les récompenses avec bonus de streak
  fields:
    habit_id:
      name: ID habitude
      description: Identifiant unique de l'habitude
      required: true
      example: "habit_321jkl"
      selector:
        text:
    child_id:
      name: ID enfant
      description: Identifiant de l'enfant qui complète l'habitude
      required: true
      example: "child_123abc"
      selector:
        text:
    completion_date:
      name: Date de complétion
      description: "Date de complétion (défaut: aujourd'hui, format ISO 8601)"
      required: false
      example: "2025-11-27"
      selector:
        text:

reset_streak:
  name: Réinitialiser le streak
  description: Réinitialise le streak d'une habitude à zéro
  fields:
    habit_id:
      name: ID habitude
      description: Identifiant de l'habitude
      required: true
      example: "habit_xyz456"
      selector:
        text:

get_habit_history:
  name: Historique d'une habitude
  description: Récupère l'historique des complétions d'une habitude
  fields:
    habit_id:
      name: ID habitude
      description: Identifiant de l'habitude
      required: true
      example: "habit_xyz456"
      selector:
        text:
    limit:
      name: Limite
      description: Nombre maximum d'entrées à retourner
      required: false
      default: 30
      example: 50
      selector:
        number:
          min: 1
          max: 365
          mode: box

# ========================================================================
# SERVICES PHASE 2 - VALIDATION
# ========================================================================

validate_task:
  name: Valider une tâche
  description: Approuve une tâche complétée et donne les récompenses à l'enfant
  fields:
    instance_id:
      name: ID instance
      description: Identifiant de l'instance de tâche à valider
      required: true
      example: "instance_789ghi"
      selector:
        text:
    validator_id:
      name: ID validateur
      description: Identifiant du parent/admin qui valide (optionnel, défaut 'admin')
      required: false
      example: "user_parent"
      selector:
        text:
    note:
      name: Note
      description: Note optionnelle de validation
      required: false
      example: "Très bien fait !"
      selector:
        text:

refuse_task:
  name: Refuser une tâche
  description: Rejette une tâche complétée et applique optionnellement des pénalités
  fields:
    instance_id:
      name: ID instance
      description: Identifiant de l'instance de tâche à refuser
      required: true
      example: "instance_789ghi"
      selector:
        text:
    validator_id:
      name: ID validateur
      description: Identifiant du parent/admin qui refuse (optionnel, défaut 'admin')
      required: false
      example: "user_parent"
      selector:
        text:
    apply_penalty:
      name: Appliquer pénalité
      description: Si true, applique les pénalités définies dans la tâche
      required: false
      default: false
      example: true
      selector:
        boolean:
    note:
      name: Note
      description: Note optionnelle de refus
      required: false
      example: "Pas suffisamment bien fait"
      selector:
        text:

# ========================================================================
# SERVICES PHASE 2 - RÉCOMPENSES
# ========================================================================

create_reward:
  name: Créer une récompense
  description: Crée une nouvelle récompense réelle (temps d'écran, sortie, choix repas, etc.)
  fields:
    title:
      name: Titre
      description: Titre de la récompense
      required: true
      example: "30 minutes d'écran supplémentaires"
      selector:
        text:
    description:
      name: Description
      description: Description détaillée
      required: false
      example: "Temps d'écran en plus le week-end"
      selector:
        text:
          multiline: true
    cost_points:
      name: Coût en points
      description: Nombre de points requis pour cette récompense
      required: true
      default: 100
      example: 150
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    requires_parent_approval:
      name: Requiert approbation
      description: Si true, un parent doit approuver la réclamation
      required: false
      default: true
      example: true
      selector:
        boolean:
    stock:
      name: Stock
      description: Nombre d'utilisations disponibles (null = illimité)
      required: false
      example: 5
      selector:
        number:
          min: 0
          max: 100
          mode: box
    cooldown_days:
      name: Cooldown (jours)
      description: Nombre de jours avant de pouvoir réclamer à nouveau
      required: false
      default: 0
      example: 7
      selector:
        number:
          min: 0
          max: 365
          mode: box

claim_reward:
  name: Réclamer une récompense
  description: Un enfant réclame une récompense (déduit les points)
  fields:
    reward_id:
      name: ID récompense
      description: Identifiant de la récompense à réclamer
      required: true
      example: "reward_abc123"
      selector:
        text:
    child_id:
      name: ID enfant
      description: Identifiant de l'enfant qui réclame
      required: true
      example: "child_123abc"
      selector:
        text:

approve_claim:
  name: Approuver une réclamation
  description: Un parent approuve la réclamation d'une récompense par un enfant
  fields:
    claim_id:
      name: ID réclamation
      description: Identifiant de la réclamation à approuver
      required: true
      example: "claim_xyz789"
      selector:
        text:
    approver_id:
      name: ID approbateur
      description: Identifiant du parent qui approuve (optionnel, défaut 'admin')
      required: false
      example: "user_parent"
      selector:
        text:

refuse_claim:
  name: Refuser une réclamation
  description: Refuse une réclamation de récompense et rembourse les points à l'enfant
  fields:
    claim_id:
      name: ID réclamation
      description: Identifiant de la réclamation à refuser
      required: true
      example: "claim_xyz789"
      selector:
        text:
    reason:
      name: Raison
      description: Raison du refus (optionnel)
      required: false
      example: "Comportement inapproprié"
      selector:
        text:

update_reward:
  name: Mettre à jour une récompense
  description: Modifie les propriétés d'une récompense existante
  fields:
    reward_id:
      name: ID récompense
      description: Identifiant de la récompense à mettre à jour
      required: true
      example: "reward_abc123"
      selector:
        text:
    title:
      name: Titre
      description: Nouveau titre (optionnel)
      required: false
      example: "Sortie au cinéma - MAJ"
      selector:
        text:
    description:
      name: Description
      description: Nouvelle description (optionnel)
      required: false
      selector:
        text:
    cost_points:
      name: Coût en points
      description: Nouveau coût en points (optionnel)
      required: false
      selector:
        number:
          min: 0
          max: 10000
          mode: box
    cost_coins:
      name: Coût en pièces
      description: Nouveau coût en pièces (optionnel)
      required: false
      selector:
        number:
          min: 0
          max: 1000
          mode: box
    image_url:
      name: URL image
      description: Nouvelle URL de l'image (optionnel)
      required: false
      selector:
        text:
    active:
      name: Active
      description: Activer ou désactiver la récompense (optionnel)
      required: false
      selector:
        boolean:

delete_reward:
  name: Supprimer une récompense
  description: Supprime définitivement une récompense
  fields:
    reward_id:
      name: ID récompense
      description: Identifiant de la récompense à supprimer
      required: true
      example: "reward_abc123"
      selector:
        text:

consume_claim:
  name: Consommer une réclamation
  description: Marque une réclamation approuvée comme consommée/utilisée
  fields:
    claim_id:
      name: ID réclamation
      description: Identifiant de la réclamation à consommer
      required: true
      example: "claim_xyz789"
      selector:
        text:

# ========================================================================
# SERVICES LISTING - INSTANCES ET CLAIMS
# ========================================================================

list_task_instances:
  name: Lister les instances de tâches
  description: Récupère la liste des instances de tâches avec filtres optionnels
  fields:
    child_id:
      name: ID enfant
      description: Filtrer par enfant (optionnel)
      required: false
      example: "child_abc123"
      selector:
        text:
    task_id:
      name: ID tâche
      description: Filtrer par tâche (optionnel)
      required: false
      example: "task_def456"
      selector:
        text:
    status:
      name: Statut
      description: Filtrer par statut (PENDING, COMPLETED_WAITING, VALIDATED, REFUSED)
      required: false
      example: "PENDING"
      selector:
        select:
          options:
            - "pending"
            - "completed_waiting"
            - "validated"
            - "refused"
            - "cancelled"
    date_from:
      name: Date de début
      description: Date de début (format ISO 8601)
      required: false
      example: "2025-11-27"
      selector:
        text:
    date_to:
      name: Date de fin
      description: Date de fin (format ISO 8601)
      required: false
      example: "2025-11-30"
      selector:
        text:
    limit:
      name: Limite
      description: Nombre maximum de résultats
      required: false
      example: 50
      selector:
        number:
          min: 1
          max: 200

list_claims:
  name: Lister les réclamations
  description: Récupère la liste des réclamations de récompenses avec filtres optionnels
  fields:
    child_id:
      name: ID enfant
      description: Filtrer par enfant (optionnel)
      required: false
      example: "child_abc123"
      selector:
        text:
    status:
      name: Statut
      description: Filtrer par statut (PENDING, APPROVED, REFUSED, CONSUMED)
      required: false
      example: "PENDING"
      selector:
        select:
          options:
            - "pending"
            - "approved"
            - "refused"
            - "consumed"
    date_from:
      name: Date de début
      description: Date de début (format ISO 8601)
      required: false
      example: "2025-11-27"
      selector:
        text:
    date_to:
      name: Date de fin
      description: Date de fin (format ISO 8601)
      required: false
      example: "2025-11-30"
      selector:
        text:

get_task_instance:
  name: Récupérer une instance de tâche
